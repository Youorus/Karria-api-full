### =====================================================================
### karria_api_v2 — source de vérité UNIQUE de la configuration du projet.
###
### Règle absolue : aucun fichier de configuration d'outil à la racine
### (pas de mypy.ini, pas de .flake8, pas de pytest.ini, pas de
### requirements*.txt). Tout vit ici. Une seule vérité, jamais deux.
### La V1 avait `mypy.ini` ET `[tool.mypy]`, six fichiers `requirements*` :
### personne ne savait lequel s'appliquait.
### =====================================================================

[project]
name = "karria-api"
version = "0.1.0"
description = "Backend Karria — monolithe modulaire FastAPI."
requires-python = ">=3.13,<3.14"
readme = "README.md"

dependencies = [
    # --- Web ---------------------------------------------------------
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "orjson>=3.10",
    "python-multipart>=0.0.20",
    # --- Configuration & validation ----------------------------------
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # --- Persistance -------------------------------------------------
    "tortoise-orm[asyncpg]>=0.23",
    "aerich>=0.8",
    # --- Stockage objet ----------------------------------------------
    # Client S3 asynchrone. `boto3` est synchrone : l'envelopper dans
    # `asyncio.to_thread` — ce que faisait la V1 — occupe un thread du pool
    # pendant toute la durée du transfert, donc plafonne les envois
    # simultanés au nombre de threads. `aioboto3` ne bloque pas la boucle.
    # Un seul client couvre tous les fournisseurs compatibles S3.
    "aioboto3>=15.5",
    # --- Observabilité -----------------------------------------------
    "structlog>=25.1",
    # --- Images ------------------------------------------------------
    # Toute image reçue est reconnue, redressée, débarrassée de ses
    # métadonnées, réduite et convertie avant d'être écrite (ADR-0009).
    # Pillow est la référence ; ses roues embarquent libjpeg, libpng et
    # libwebp — rien à installer dans l'image Docker. Écarté : libvips,
    # plus rapide mais dépendant d'une bibliothèque système.
    "pillow>=12.3.0",
    # Le HEIC des iPhone récents, que Pillow ne lit pas seul. Roues avec
    # libheif embarquée, même raison.
    "pillow-heif>=1.7.0",
    # --- Connexion Apple et Google (module `identity`) ---------------
    # Vérification des jetons d'identité signés RS256 par Apple et Google
    # (ADR-0011). `[crypto]` tire `cryptography`, indispensable pour RSA.
    # Aucun SDK Google ni Firebase : les jetons sont des JWT standard, et
    # un SDK par fournisseur serait deux fois plus de surface à suivre.
    "pyjwt[crypto]>=2.10",
    # --- Lecture des CV importés (module `cv`) -----------------------
    "pypdf>=6.21.1",
    # --- Offres d'emploi (module `offers`, ADR-0016) -----------------
    # Collecte : JobSpy interroge Indeed et HelloWork. Il tire pandas et
    # BeautifulSoup ; il n'est importé que par `karria.collector`, un
    # processus à part (même image, autre commande) — import-linter
    # interdit à l'API de le charger.
    "python-jobspy>=1.4.0",
    # File de travaux durable sur PostgreSQL (collecte planifiée, index,
    # alertes, suite du fil) : pas de Redis à opérer, pas d'éviction
    # silencieuse de travaux (la V1 a perdu des travaux ARQ sous
    # `allkeys-lru`), et un dédoublonnage par verrou de file natif.
    "procrastinate>=3.10.0",
    # Le téléchargement des logos (ADR-0021) : client asynchrone en flux,
    # délais et redirections maîtrisés. Déjà là pour les tests.
    "httpx>=0.28",
    # Le pilote de procrastinate ; `binary` embarque libpq (rien à
    # installer dans l'image), `pool` sert le connecteur asynchrone.
    "psycopg[binary,pool]>=3.3.6",
    # --- Ce qui n'est PAS ici, et pourquoi ---------------------------
    # Aucun SDK de modèle (Gemini), aucun client Qdrant ni TEI (trois
    # appels REST chacun, sur le client sortant du socle), aucun hachage
    # de mot de passe : chaque dépendance arrive avec le module qui la
    # justifie, dans le commit qui le crée (AGENTS.md §6.11).
    "python-docx>=1.2",
    "pdfplumber>=0.11",
    "fonttools>=4.60",
    "numpy>=2.3",
    "stripe>=16.0.0",
]

[project.optional-dependencies]
# Dépendances présentes UNIQUEMENT dans l'image de production.
prod = ["gunicorn>=23.0"]

[dependency-groups]
# Groupes de développement (PEP 735), installés par `uv sync` mais jamais
# embarqués dans l'image Docker de production.
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "mypy>=1.14",
    "ruff>=0.9",
    "import-linter>=2.1",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karria"]


### =====================================================================
### RUFF — lint + format. Remplace à lui seul black, isort et flake8.
### =====================================================================

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade — force la syntaxe moderne
    "ANN",       # flake8-annotations — le typage n'est pas optionnel
    "ASYNC",     # flake8-async — pièges async (appels bloquants)
    "S",         # bandit — sécurité
    "B",         # bugbear
    "A",         # shadowing de builtins
    "C4",        # comprehensions
    "DTZ",       # datetime naïfs interdits (source classique de bugs de fuseau)
    "T20",       # aucun print() — on a un logger
    "PT",        # style pytest
    "RET",       # returns inutiles
    "SIM",       # simplifications
    "TID",       # imports relatifs interdits
    "ARG",       # arguments inutilisés
    "PTH",       # pathlib plutôt que os.path
    "ERA",       # code commenté interdit
    "PL",        # pylint
    "PERF",      # performance
    "RUF",       # règles ruff
]
# `TC` (flake8-type-checking) est délibérément absent. Il déplacerait les
# imports vers des blocs `TYPE_CHECKING` pour accélérer le démarrage — mais
# Pydantic et FastAPI résolvent les annotations à l'EXÉCUTION. Les imports
# ainsi déplacés produisent des `NameError` au premier appel. Le contourner
# par une liste de classes et décorateurs « évalués à l'exécution » revient
# à maintenir un inventaire qui se désynchronise silencieusement. Le gain
# ne vaut pas le risque.
ignore = [
    "E501",      # longueur de ligne — géré par le formateur
    "ANN401",    # Any explicite — parfois légitime (**kwargs de middleware)
    "B008",      # appel dans un défaut d'argument — c'est l'idiome Depends() de FastAPI
    "PLR0913",   # nombre d'arguments — un use case injecté a naturellement des dépendances
]

# Typographie française des textes rendus aux personnes et des docstrings :
# apostrophe courbe, tiret demi-cadratin, signe ×, espace insécable.
allowed-confusables = ["’", "–", "×", "−", "σ", "\u00a0"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",      # assert : c'est littéralement le rôle d'un test
    "ANN201",    # annotations de retour sur les tests
    "PLR2004",   # valeurs magiques dans les assertions
    "ARG",       # fixtures injectées non utilisées directement
    # Un argument nommé `token` déclenche la détection de secret en dur,
    # quelle que soit sa valeur. Dans les tests, ce sont des jetons
    # factices — aucun ne donne accès à quoi que ce soit. La règle reste
    # **active dans `src/`**, où elle a un sens.
    "S106",
]
"scripts/**/*.py" = ["T20"]  # les scripts CLI ont le droit d'écrire sur stdout

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"  # toujours `from karria.x import y`, jamais `from ..x`

[tool.ruff.lint.isort]
known-first-party = ["karria"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true


### =====================================================================
### MYPY — strict, sans exception tolérée dans src/.
### =====================================================================

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["karria"]
strict = true

# Durcissements au-delà de `strict`.
warn_unreachable = true
disallow_any_unimported = true
enable_error_code = [
    "redundant-expr",
    "possibly-undefined",
    "truthy-bool",
    "ignore-without-code",  # interdit les `# type: ignore` nus
]

[[tool.mypy.overrides]]
# Tortoise et aioboto3 n'exposent pas de stubs complets. On tolère
# l'imprécision à la frontière de la bibliothèque, JAMAIS dans notre propre
# code : le client S3 est typé `Any` derrière le port `ObjectStorage`, et
# aucun appelant ne voit jamais ce type.
module = ["tortoise.*", "aerich.*", "aioboto3.*", "aiobotocore.*", "botocore.*", "jobspy.*", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Bibliothèques PDF, polices et XML du module `documents` (ADR-0020), sans
# stubs. Elles ne sont appelées que dans son infrastructure ; les types qui
# en sortent sont convertis en types du projet à la frontière.
module = ["pypdfium2.*", "fontTools.*", "lxml.*", "docx.*"]
ignore_missing_imports = true
disallow_any_unimported = false


### =====================================================================
### PYTEST
### =====================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
# Un avertissement de dépréciation ignoré devient une rupture au prochain
# passage de version majeure. On les traite comme des erreurs : la dette
# se rembourse le jour où elle apparaît, pas le jour où elle explose.
filterwarnings = ["error"]
markers = [
    "unit: test isolé, aucune I/O réelle (doit tourner en millisecondes)",
    "integration: test avec dépendance réelle (base de données, cache)",
    "e2e: test traversant toute la stack HTTP",
]


### =====================================================================
### COUVERTURE — le seuil est un contrat, pas une statistique.
### =====================================================================

[tool.coverage.run]
source = ["src/karria"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "class .*\\(Protocol\\):",
]


### =====================================================================
### AERICH — les modèles ne sont PAS listés ici : ils sont dérivés du
### registre de modules (src/karria/bootstrap/modules.py). Une seule
### source de vérité pour les routers ET les tables.
### =====================================================================

[tool.tortoise]
tortoise_orm = "karria.bootstrap.orm.TORTOISE_ORM"
location = "./migrations"
src_folder = "./src"


### =====================================================================
### IMPORT-LINTER — les frontières d'architecture, vérifiées mécaniquement.
###
### C'est la pièce qui manquait le plus à la V1. Une règle écrite dans un
### README est une intention ; une règle vérifiée en CI est une garantie.
### Un import illégal casse le build, le jour où il est écrit — et non
### dix-huit mois plus tard, quand le désenchevêtrer coûte un trimestre.
###
### Ajouter un module = l'ajouter aux `containers` de la Règle 2, aux
### `source_modules` de la Règle 2 bis et aux `modules` de la Règle 4.
### =====================================================================

[tool.importlinter]
root_package = "karria"
# Requis pour interdire au domaine d'importer des paquets tiers (FastAPI,
# Tortoise) et pas seulement des modules internes.
include_external_packages = true

# --- Règle 1 & la place de bootstrap ---------------------------------
[[tool.importlinter.contracts]]
name = "Règle 1 — shared/ ne connaît pas le métier"
type = "layers"
layers = ["karria.main", "karria.bootstrap", "karria.modules", "karria.shared"]
# Lecture : une couche peut importer celles du dessous, jamais celles du
# dessus. `shared` ignore donc `modules` et `bootstrap` ; `modules` ignore
# `bootstrap`. Seul l'assemblage voit l'ensemble — c'est son rôle.

# --- Le collecteur, de l'autre côté du contrat (ADR-0016) -------------
[[tool.importlinter.contracts]]
name = "Collecteur — il ne connaît de l'API que son contrat HTTP"
type = "forbidden"
source_modules = ["karria.collector"]
forbidden_modules = [
    "karria.main",
    "karria.bootstrap",
    "karria.modules",
    "karria.shared.database",
    "karria.shared.storage",
    "karria.shared.queue",
    "karria.shared.http",
    "karria.shared.auth",
    "karria.shared.mail",
    "tortoise",
    "fastapi",
    "procrastinate",
]
# Le collecteur parle à des sites tiers et peut être banni ou cassé : il
# ne doit pouvoir atteindre ni la base, ni le stockage, ni la file. Il
# n'emprunte au socle que la journalisation (et sa configuration).

[[tool.importlinter.contracts]]
name = "Collecteur — l'API ne l'importe jamais"
type = "forbidden"
source_modules = ["karria.main", "karria.bootstrap", "karria.modules", "karria.shared"]
forbidden_modules = ["karria.collector", "jobspy"]
# JobSpy (et pandas derrière lui) ne se charge que dans le processus du
# collecteur : une API qui l'importerait hériterait de ses pannes.

# --- Règle 2 ---------------------------------------------------------
[[tool.importlinter.contracts]]
name = "Règle 2 — les dépendances vont vers l'intérieur"
type = "layers"
# Les parenthèses marquent une couche **facultative** : un module de pur
# référentiel n'a ni use case ni adaptateur, et lui imposer deux paquets
# vides ferait croire à une architecture qu'il n'a pas. L'ordre reste
# imposé dès qu'une couche existe — c'est là tout le contrat.
layers = ["api", "(infrastructure)", "(application)", "domain"]
containers = [
    "karria.modules.health",
    "karria.modules.identity",
    "karria.modules.devices",
    "karria.modules.cv",
    "karria.modules.offers",
    "karria.modules.documents",
]

[[tool.importlinter.contracts]]
name = "Règle 2 bis — le domaine ignore tout framework"
type = "forbidden"
source_modules = [
    "karria.modules.health.domain",
    "karria.modules.identity.domain",
    "karria.modules.devices.domain",
    "karria.modules.cv.domain",
    "karria.modules.offers.domain",
    "karria.modules.documents.domain",
]
forbidden_modules = [
    "fastapi",
    "starlette",
    "tortoise",
    "karria.shared.config",
    "karria.shared.database",
    "karria.shared.http",
    "karria.shared.logging",
    "karria.shared.auth",
    "karria.shared.storage",
    "karria.shared.mail",
    "karria.shared.images",
]
# Le domaine peut importer `karria.shared.errors` (noyau partagé, sans
# dépendance) et la bibliothèque standard. Rien d'autre. C'est ce qui rend
# les règles métier testables en une milliseconde.

# --- Règle 4 ---------------------------------------------------------
[[tool.importlinter.contracts]]
name = "Règle 4 — les modules ne s'importent pas entre eux"
type = "independence"
modules = [
    "karria.modules.health",
    "karria.modules.identity",
    "karria.modules.devices",
    "karria.modules.cv",
    "karria.modules.offers",
    "karria.modules.documents",
]
# Les modules communiquent par le bus d'événements. Toute exception à cette
# règle doit être justifiée par une ADR et déclarée ici en `ignore_imports`.
